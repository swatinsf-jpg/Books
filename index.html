<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b22"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<title>PDF Flipbook</title>
<style>
body{--bg:#1c1b22;--fg:#f4efe6;--ac:#e8a84c;--mu:#9b97a8;--cd:#2c2a36}
body[data-theme=light]{--bg:#eceaf2;--fg:#22212a;--mu:#6c6a78;--cd:#fff}
body[data-theme=sepia]{--bg:#e9dcc3;--fg:#3b2f1e;--mu:#7d6a4c;--cd:#f5ead2}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;overflow-x:auto;flex:none}
h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:60px}
button,.btn{background:var(--cd);color:var(--fg);border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;flex:none}
.btn.p,button.p{background:var(--ac);color:#1c1b22;font-weight:600}button:disabled{opacity:.35}button.on{outline:2px solid var(--ac)}
[hidden]{display:none!important}
#lib{flex:1;overflow:auto;padding:12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.card{background:var(--cd);border-radius:10px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#fff}
.card div{padding:8px;font-size:13px}.card small{color:var(--mu);display:block}
.card .x{position:absolute;top:6px;right:6px;padding:2px 8px;background:#000a;color:#fff}
.bar{height:4px;background:var(--ac);width:0;position:fixed;top:0;left:0;transition:width .2s;z-index:99}
#drop{text-align:center;color:var(--mu);padding:28px;border:2px dashed var(--mu);border-radius:14px;margin-bottom:16px}
#drop.on{border-color:var(--ac)}
#rd{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:2600px;min-height:0;overflow:hidden;touch-action:pan-y}
#zm{transition:transform .25s}#zm.drag{transition:none}
#wrap{transition:transform .8s;transform-style:preserve-3d;position:relative;box-shadow:0 20px 50px #0006}
.leaf{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.5,.1,.3,1),z-index 0s .4s}
.leaf.f{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;overflow:hidden}
.face img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.back{transform:rotateY(180deg)}
.face:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 10%)}
.back:after{background:linear-gradient(270deg,rgba(0,0,0,.3),transparent 10%)}
.single .leaf{width:100%}.single .back{display:none}
footer{display:flex;gap:10px;align-items:center;padding:8px 12px;flex:none}
#sl{flex:1;accent-color:var(--ac)}#pg{min-width:84px;text-align:center;color:var(--mu);font-size:13px}
#dr{position:absolute;left:0;top:0;bottom:0;width:min(320px,88vw);background:var(--cd);box-shadow:4px 0 24px #0006;transform:translateX(-105%);transition:transform .3s;z-index:20;display:flex;flex-direction:column}
#dr.o{transform:none}
#tabs{display:flex;gap:6px;padding:8px}#tabs button{flex:1}
#th{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px;align-content:start}
.t{cursor:pointer;text-align:center;font-size:12px;color:var(--mu)}.t img{width:100%;aspect-ratio:3/4;background:#fff;display:block;border-radius:3px}.t.cur img{outline:3px solid var(--ac)}
#sp{flex:1;overflow:auto;padding:8px}#sp input{width:100%;padding:9px;border-radius:8px;border:0;background:var(--bg);color:var(--fg);font:inherit}
.r{padding:8px;border-bottom:1px solid #8883;cursor:pointer;font-size:13px}.r b{color:var(--ac)}.r mark{background:var(--ac);color:#000}
</style></head><body>
<div class="bar" id="bar"></div>
<section id="lib" style="display:flex;flex-direction:column;flex:1;min-height:0">
<header><h1>📖 PDF Flipbook</h1><button id="ins" hidden>Install</button><button id="th0">🌓</button><label class="btn p">+ Open PDF<input id="fi" type="file" accept="application/pdf" hidden></label></header>
<div id="lib2" style="flex:1;overflow:auto;padding:12px"><div id="drop">Drop a PDF here or tap <b>+ Open PDF</b>.<br>Books are saved on your device and work offline.</div><div id="grid"></div></div>
</section>
<section id="rd" hidden>
<header><button id="bk">←</button><button id="mn">☰</button><h1 id="ti"></h1><button id="zo">−</button><button id="zi">+</button><button id="sn">🔊</button><button id="ap">▶</button><button id="fs">⛶</button><button id="th1">🌓</button></header>
<div id="stage"><div id="zm"><div id="wrap"></div></div></div>
<footer><button id="pv">‹</button><input id="sl" type="range" min="1" value="1"><span id="pg"></span><button id="nx">›</button></footer>
<aside id="dr"><div id="tabs"><button id="t1" class="on">Pages</button><button id="t2">Search</button><button id="cl">✕</button></div>
<div id="th"></div><div id="sp" hidden><input id="q" placeholder="Search text in this PDF…"><div id="rs"></div></div></aside>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
const $=s=>document.querySelector(s),ls=localStorage;
// ---------- storage ----------
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('flipbook',2);r.onupgradeneeded=()=>{const d=r.result;['k'].forEach(n=>d.objectStoreNames.contains(n)||d.createObjectStore(n));if(!d.objectStoreNames.contains('books'))d.createObjectStore('books',{keyPath:'id'});if(!d.objectStoreNames.contains('bufs'))d.createObjectStore('bufs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(st,m,f)=>dbp.then(d=>new Promise((res,rej)=>{const t=d.transaction(st,m),q=f(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)}));
// ---------- theme ----------
const th=['dark','light','sepia'];let ti=th.indexOf(ls.theme);if(ti<0)ti=0;
const setTh=()=>{document.body.dataset.theme=th[ti];ls.theme=th[ti]};setTh();
['#th0','#th1'].forEach(s=>$(s).onclick=()=>{ti=(ti+1)%3;setTh()});
// ---------- library ----------
async function showLib(){
  stopAuto();$('#rd').hidden=true;$('#lib').hidden=false;
  const bs=(await tx('books','readonly',s=>s.getAll())||[]).sort((a,b)=>b.added-a.added);
  $('#grid').innerHTML='';
  bs.forEach(b=>{const c=document.createElement('div');c.className='card';
    c.innerHTML=`<img src="${b.thumb}"><div>${b.name.replace(/</g,'&lt;')}<small>${b.n} pages${ls['p'+b.id]?' · p.'+ls['p'+b.id]:''}</small></div><button class="x">✕</button>`;
    c.onclick=()=>openBook(b.id);
    c.querySelector('.x').onclick=async e=>{e.stopPropagation();if(confirm('Delete this book?')){await tx('books','readwrite',s=>s.delete(b.id));await tx('bufs','readwrite',s=>s.delete(b.id));showLib()}};
    $('#grid').appendChild(c)});
}
$('#fi').onchange=e=>{const f=e.target.files[0];if(f)addFile(f);e.target.value=''};
const dz=$('#drop');
['dragover','dragenter'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('on')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f&&/pdf/i.test(f.type+f.name))addFile(f)});
let pdf,N=0,meta;
const load=buf=>pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;
const rend=async(n,h,q=.85)=>{const p=await pdf.getPage(n),v0=p.getViewport({scale:1}),v=p.getViewport({scale:h/v0.height}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c.toDataURL('image/jpeg',q)};
async function addFile(f){
  $('#bar').style.width='30%';
  try{const buf=await f.arrayBuffer();pdf=await load(buf);N=pdf.numPages;
    const p=await pdf.getPage(1),v=p.getViewport({scale:1}),thumb=await rend(1,320,.7);
    const id=Date.now().toString(36);
    await tx('bufs','readwrite',s=>s.put(buf,id));
    await tx('books','readwrite',s=>s.put({id,name:f.name.replace(/\.pdf$/i,''),n:N,thumb,ratio:v.width/v.height,added:Date.now()}));
    $('#bar').style.width='0';openBook(id);
  }catch(e){$('#bar').style.width='0';alert('Could not read that PDF.')}
}
// ---------- reader ----------
let pc=new Map(),imgs={},leaves=[],cur=0,single=false,tok=0,z=1,px=0,py=0,texts=null,autoT=null;
async function openBook(id){
  meta=await tx('books','readonly',s=>s.get(id));const buf=await tx('bufs','readonly',s=>s.get(id));
  if(!meta||!buf)return;pdf=await load(buf);N=pdf.numPages;pc=new Map();texts=null;z=1;px=py=0;applyZ();
  $('#lib').hidden=true;$('#rd').hidden=false;$('#ti').textContent=meta.name;$('#sl').max=N;
  $('#rs').innerHTML='';$('#q').value='';buildThumbs();
  const last=+ls['p'+id]||1;cur=single?last-1:Math.floor(last/2);build(last);
}
function build(goN){
  const st=$('#stage'),aw=st.clientWidth-16,ah=st.clientHeight-24,r=meta.ratio;single=aw<720;
  const Hh=Math.min(ah,(single?aw:aw/2)/r),W=Hh*r,w=$('#wrap');
  w.className=single?'single':'';w.style.height=Hh+'px';w.style.width=(single?W:2*W)+'px';w.innerHTML='';
  imgs={};leaves=[];const step=single?1:2,L=Math.ceil(N/step);
  const mk=n=>{const f=document.createElement('div');f.className='face';if(n<=N){const i=document.createElement('img');i.draggable=false;imgs[n]=i;f.appendChild(i)}return f};
  for(let k=0;k<L;k++){const d=document.createElement('div');d.className='leaf';d.appendChild(mk(k*step+1));if(!single){const b=mk(k*step+2);b.classList.add('back');d.appendChild(b)}w.appendChild(d);leaves.push(d)}
  if(goN)goto(goN);else sync(true);
}
function curPage(){return single?cur+1:cur==0?1:cur*2}
function goto(n){n=Math.max(1,Math.min(N,n));cur=single?n-1:Math.floor(n/2);sync()}
const go=d=>{const L=leaves.length;const nc=Math.max(0,Math.min(single?L-1:L,cur+d));if(nc!==cur){cur=nc;sync();swoosh()}};
function sync(quiet){
  const L=leaves.length,w=$('#wrap'),W=w.clientWidth;
  leaves.forEach((d,k)=>{const f=k<cur;d.classList.toggle('f',f);d.style.zIndex=f?k:L-k});
  w.style.transform=single?'none':cur==0?`translateX(-${W/4}px)`:cur==L?`translateX(${W/4}px)`:'none';
  const p=curPage();$('#sl').value=p;
  $('#pg').textContent=single?`${p} / ${N}`:cur==0?`1 / ${N}`:cur==L?`${N} / ${N}`:`${cur*2}–${Math.min(N,cur*2+1)} / ${N}`;
  $('#pv').disabled=cur==0;$('#nx').disabled=cur>=(single?L-1:L);
  if(meta)ls['p'+meta.id]=p;
  document.querySelectorAll('.t').forEach(t=>t.classList.toggle('cur',+t.dataset.n==p||(!single&&+t.dataset.n==p+1&&cur>0)));
  ensure();
}
const page=n=>pc.get(n)||(pc.set(n,rend(n,1400)),pc.get(n));
async function ensure(){
  const t=++tok,c=curPage(),ns=[];
  for(let d=0;d<=6;d++)[c+d,c-d].forEach(n=>{if(n>=1&&n<=N&&!ns.includes(n))ns.push(n)});
  for(const k of [...pc.keys()])if(Math.abs(k-c)>16){pc.delete(k);if(imgs[k])imgs[k].removeAttribute('src')}
  for(const n of ns){if(t!==tok)return;const u=await page(n);if(imgs[n]&&imgs[n].getAttribute('src')!==u)imgs[n].src=u}
}
$('#nx').onclick=()=>go(1);$('#pv').onclick=()=>go(-1);
$('#sl').oninput=e=>goto(+e.target.value);
$('#bk').onclick=showLib;
addEventListener('keydown',e=>{if($('#rd').hidden)return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);if(e.key=='Escape')$('#dr').classList.remove('o');if(e.key=='+')zoom(.5);if(e.key=='-')zoom(-.5)});
// zoom / pan / swipe / tap
function applyZ(){$('#zm').style.transform=`translate(${px}px,${py}px) scale(${z})`}
function zoom(d){z=Math.max(1,Math.min(4,z+d));if(z==1)px=py=0;applyZ()}
$('#zi').onclick=()=>zoom(.5);$('#zo').onclick=()=>zoom(-.5);
const stg=$('#stage');let sx=null,sy,mv=0,pd=null;
stg.addEventListener('dblclick',()=>{z=z>1?1:2.2;px=py=0;applyZ()});
stg.addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoom(e.deltaY<0?.25:-.25)}},{passive:false});
stg.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;mv=0;pd={x:px,y:py};if(z>1)$('#zm').classList.add('drag')});
stg.addEventListener('pointermove',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;mv=Math.max(mv,Math.abs(dx),Math.abs(dy));if(z>1){px=pd.x+dx;py=pd.y+dy;applyZ()}});
stg.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;$('#zm').classList.remove('drag');
  if(z==1){if(mv>45&&Math.abs(dx)>Math.abs(e.clientY-sy))go(dx<0?1:-1);else if(mv<8){const r=stg.getBoundingClientRect();go(e.clientX-r.left>r.width/2?1:-1)}}sx=null});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!$('#rd').hidden){const p=curPage();build(p)}},200)});
// sound, autoplay, fullscreen
let snd=ls.snd!=='0',ac;$('#sn').textContent=snd?'🔊':'🔇';
$('#sn').onclick=()=>{snd=!snd;ls.snd=snd?1:0;$('#sn').textContent=snd?'🔊':'🔇'};
function swoosh(){if(!snd)return;try{ac=ac||new AudioContext();const n=ac.sampleRate*.3|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=1600;g.gain.value=.22;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);s.start()}catch(e){}}
function stopAuto(){clearInterval(autoT);autoT=null;$('#ap').textContent='▶';$('#ap').classList.remove('on')}
$('#ap').onclick=()=>{if(autoT)return stopAuto();$('#ap').textContent='⏸';$('#ap').classList.add('on');autoT=setInterval(()=>{if($('#nx').disabled)stopAuto();else go(1)},3500)};
$('#fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.().catch(()=>{});
// drawer: thumbnails + search
$('#mn').onclick=()=>$('#dr').classList.toggle('o');$('#cl').onclick=()=>$('#dr').classList.remove('o');
const tab=n=>{$('#th').hidden=n!=1;$('#sp').hidden=n!=2;$('#t1').classList.toggle('on',n==1);$('#t2').classList.toggle('on',n==2);if(n==2)$('#q').focus()};
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
function buildThumbs(){
  const t=$('#th');t.innerHTML='';tab(1);
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const n=+e.target.dataset.n;rend(n,260,.6).then(u=>e.target.querySelector('img').src=u)}}),{root:t});
  for(let n=1;n<=N;n++){const d=document.createElement('div');d.className='t';d.dataset.n=n;d.innerHTML=`<img alt=""><span>${n}</span>`;d.onclick=()=>{goto(n);if(innerWidth<720)$('#dr').classList.remove('o')};t.appendChild(d);io.observe(d)}
}
async function index(){
  texts=[];for(let n=1;n<=N;n++){const p=await pdf.getPage(n),c=await p.getTextContent();texts.push(c.items.map(i=>i.str).join(' '));$('#rs').innerHTML=`<div class="r">Indexing ${n}/${N}…</div>`}
}
let qt;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(async()=>{
  const q=$('#q').value.trim().toLowerCase();if(q.length<2){$('#rs').innerHTML='';return}
  if(!texts)await index();
  const out=[];texts.forEach((t,i)=>{const j=t.toLowerCase().indexOf(q);if(j>=0&&out.length<80){const s=t.slice(Math.max(0,j-30),j+q.length+50).replace(/</g,'&lt;');const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');out.push(`<div class="r" data-n="${i+1}"><b>p.${i+1}</b> …${s.replace(re,m=>'<mark>'+m+'</mark>')}…</div>`)}});
  $('#rs').innerHTML=out.join('')||'<div class="r">No matches (scanned PDFs have no text)</div>';
  $('#rs').querySelectorAll('.r[data-n]').forEach(r=>r.onclick=()=>{goto(+r.dataset.n);if(innerWidth<720)$('#dr').classList.remove('o')})},300)};
// install + SW
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ins').hidden=false});
$('#ins').onclick=()=>{dp&&dp.prompt();$('#ins').hidden=true};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
showLib();
</script></body></html>
